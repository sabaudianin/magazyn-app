appId: com.magazyn.app
productName: Magazyn
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!resources/**'
# fonts/ i templates/ są czytane w runtime przez getResourcePath() (process.resourcesPath), nie
# importowane w kodzie — Vite ich nie bundluje, więc trzeba je jawnie skopiować do spakowanej
# appki. resources/icon.png nie jest tu potrzebne (osadzone przez Vite przy imporcie ?asset).
extraResources:
  - from: resources/fonts
    to: fonts
  - from: resources/templates
    to: templates
# natywny moduł better-sqlite3 (.node) nie ładuje się z wnętrza archiwum asar
asarUnpack:
  - '**/*.node'
win:
  executableName: Magazyn
  icon: build/icon.ico
  target:
    - nsis
    - portable
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
npmRebuild: false
